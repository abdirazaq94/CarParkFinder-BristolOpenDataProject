<html>
    <head>
        <title> 
            Car Park Finder
        </title>
        <link rel="stylesheet" href="stylesheet.css">
        <script>
            let CarparkData= [];
            function outputTable(stuff){
                                    CarparkData = stuff.features;
                                    let element =  document.getElementById("resultstble");
                                    let features = stuff.features;
                                    for (let i = 0; i < features.length; i++) {
                                                                                let tr= document.createElement("tr");
                                                                                let a = features[i].attributes;
                                                                                let td1 = document.createElement("td");
                                                                                td1.innerHTML = a.NAME;
                                                                                let td2 = document.createElement("td");
                                                                                td2.innerHTML = a.OPERATING_TIMES;
                                                                                let td3 = document.createElement("td");
                                                                                td3.innerHTML = a.TYPE_DESCRIPTION;
                                                                                let td4 = document.createElement("td");
                                                                                td4.innerHTML = a.SPACES;
                                                                                let td5 = document.createElement("td");
                                                                                td5.innerHTML = a.AREA_NAME;
                                                                                tr.appendChild(td1);
                                                                                tr.appendChild(td2);
                                                                                tr.appendChild(td3);
                                                                                tr.appendChild(td4);
                                                                                tr.appendChild(td5);
                                                                                element.appendChild(tr);
                                        
                                    }
            }
            function query(){
                            let url="https://maps2.bristol.gov.uk/server2/rest/services/ext/ll_transport/MapServer/5/query?where=1%3D1&outFields=NAME,AREA_NAME,OPERATOR_NAME,SPACES,OPERATING_TIMES,TYPE_DESCRIPTION,CCTV&outSR=4326&f=json";
                            fetch(url)
                            .then(response => response.json())
                            .then(outputTable)
                            
            }
                query();
            
            function carsearchbar(){
                let typed = document.getElementById("searchbar").value.toLowerCase();
                let table = document.getElementById("resultstble");
                table.innerHTML = "";
                for (let i=0; i <CarparkData.length; i++){
                    let a= CarparkData[i].attributes;
                    let name = a.NAME.toLowerCase();
                    let area = a.AREA_NAME.toLowerCase();
                    if (name.includes(typed) || area.includes(typed)){
                        let tr= document.createElement("tr");
                        let td1 = document.createElement("td");
                        td1.innerHTML = a.NAME;
                        let td2 = document.createElement("td");
                        td2.innerHTML = a.OPERATING_TIMES;
                        let td3 = document.createElement("td");
                        td3.innerHTML = a.TYPE_DESCRIPTION;         
                        let td4 = document.createElement("td");
                        td4.innerHTML = a.SPACES;
                        let td5 = document.createElement("td");
                        td5.innerHTML = a.AREA_NAME;
                        tr.appendChild(td1);
                        tr.appendChild(td2);
                        tr.appendChild(td3);
                        tr.appendChild(td4);
                        tr.appendChild(td5);
                        table.appendChild(tr);        
                    }
                }
            }    
        </script>
    </head>
    <body>
        <header>
        </header>
        <div class="heading">
                    <div class="title">
                                        Car Park Finder
                    </div>

                    <div class="search">
                        <input type="text" placeholder="Search car park or area "id="searchbar">
                        <button  onclick="carsearchbar()">Search</button>                                        
                    </div>
        </div>
        <hr class="horizontal">
        <div class="leftbox">
                            <div class="lefttext">
                                                <div class="findnear">
                                                                FIND NEAREST
                                                </div>
                                                <div class="filter">
                                                                FILTERS
                                                </div>
                                                <div class="options">
                                                                    <label><br>
                                                                            <input type="checkbox">
                                                                                                Multi Story
                                                                    </label><br>
                                                                    <label>
                                                                            <input type="checkbox">
                                                                                                Surface
                                                                    </label><br>
                                                                    <label>
                                                                            <input type="checkbox">
                                                                                                On street
                                                                    </label><br>
                                                                    <label>
                                                                            <input type="checkbox">
                                                                                                Park & Ride
                                                                    </label><br>                                                                                                                                   
                                                </div>
                            </div>
        </div>
        <br>
        <center style="font-size: 20px;" >
                                       <u>RESULTS</u>
        </center>
        <br>
        <center>
                <p>
                    Select filters or search to see available car parks
                </p>
        </center>
        <div class="contain-table">
            <center> 
            <table>
            <tr>
                <th >Car Park Name</th>
                <th>Times</th>
                <th>Type</th>
                <th>Spaces</th>
                <th>Area</th>
            </tr>
            <tbody id="resultstble"></tbody>
        </table>
            </center>
        </div>
        <div class="results">
                            View All Results
        </div>
    </body>  
</html>
