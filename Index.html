<html>
    <head>
        <title> 
            Car Park Finder Map
        </title>
        <link rel="stylesheet" href="stylesheet.css">
        <script>
            let CarparkData= [];
            function outputTable(stuff){
                                    CarparkData = stuff.features;
                                    let element =  document.getElementById("resultstble");
                                    let features = stuff.features;
                                    for (let i = 0; i < features.length; i++) {
                                                                                let tr= document.createElement("tr");
                                                                                let a = features[i].attributes;
                                                                                let td1 = document.createElement("td");
                                                                                td1.innerHTML = a.NAME;
                                                                                let td2 = document.createElement("td");
                                                                                td2.innerHTML = a.OPERATING_TIMES;
                                                                                let td3 = document.createElement("td");
                                                                                td3.innerHTML = a.TYPE_DESCRIPTION;
                                                                                let td4 = document.createElement("td");
                                                                                td4.innerHTML = a.SPACES;
                                                                                let td5 = document.createElement("td");
                                                                                td5.innerHTML = a.AREA_NAME;
                                                                                tr.appendChild(td1);
                                                                                tr.appendChild(td2);
                                                                                tr.appendChild(td3);
                                                                                tr.appendChild(td4);
                                                                                tr.appendChild(td5);
                                                                                element.appendChild(tr);
                                        
                                    }
            }
            function query(){
                document.getElementById("loading").style.display = "block";
                            let url= "https://maps2.bristol.gov.uk/server2/rest/services/ext/ll_transport/MapServer/5/query?where=1%3D1&outFields=NAME,NUMBER_LEVELS,AREA_NAME,OPERATOR_NAME,SPACES,OPERATING_TIMES,TYPE_DESCRIPTION,CCTV&outSR=4326&f=json";
                            fetch(url)
                            .then(response => response.json())
                            .then(outputTable)
                            .finally(() => {
                                document.getElementById("loading").style.display = "none";
                            })
            
            }
                window.onload = query;
            
            function carsearchbar(){
                let typed = document.getElementById("searchbar").value.toLowerCase();
                let multi = document.getElementById("multi").checked;
                let surface = document.getElementById("surface").checked;
                let onstreet = document.getElementById("onstreet").checked;
                let camera = document.getElementById("camera").checked;
                let table = document.getElementById("resultstble");
                table.innerHTML = "";
                let count = 0;
                for (let i=0; i <CarparkData.length; i++){
                    let a= CarparkData[i].attributes;
                    let name = a.NAME.toLowerCase();
                    let area = a.AREA_NAME.toLowerCase();
                    let category= a.NUMBER_LEVELS.toLowerCase();
                    let cctv = a.CCTV.toLowerCase();
                    
                    let matchMulti = !multi || category.includes("mscp");
                    let matchSurface = !surface || category.includes("surface");
                    let matchOnstreet = !onstreet || category.includes("u/ground");
                    let matchCamera = !camera || cctv.includes("yes");

                    let searches= name.includes(typed) || area.includes(typed);
                    let filters= matchMulti && matchSurface && matchOnstreet && matchCamera;
                    
                    if (searches && filters){
                        let tr= document.createElement("tr");
                        let td1 = document.createElement("td");
                        td1.innerHTML = a.NAME;
                        let td2 = document.createElement("td");
                        td2.innerHTML = a.OPERATING_TIMES;
                        let td3 = document.createElement("td");
                        td3.innerHTML = a.TYPE_DESCRIPTION;         
                        let td4 = document.createElement("td");
                        td4.innerHTML = a.SPACES;
                        let td5 = document.createElement("td");
                        td5.innerHTML = a.AREA_NAME;
                        tr.appendChild(td1);
                        tr.appendChild(td2);
                        tr.appendChild(td3);
                        tr.appendChild(td4);
                        tr.appendChild(td5);
                        table.appendChild(tr);   
                        count++;     
                    }
                   
                }
                if (count === 0){
                    let tr = document.createElement("tr");
                    let td = document.createElement("td");
                    td.setAttribute("colspan", "5");
                    td.innerHTML = "No results found";
                    tr.appendChild(td);
                    table.appendChild(tr);
                }
            }    
        </script>
        </head>
    <body>
        <header>
        </header>
        <div class="heading">
                    <div class="title">
                                        Car Park Finder 
                    </div>
        <div class="loading" id="loading">
            Loading list...
        </div>
                    <div class="search">
                        <input type="text" placeholder="Search car park or area "id="searchbar">
                        <button  onclick="carsearchbar()">Search</button>                                        
                    </div>
        </div>
        <hr class="horizontal">
        <div class="leftbox">
                            <div class="lefttext">
                                                <div class="Mapview">
                                                               <a href="map.html">Map View</a>
                                                </div>
                                                <div class="filter">
                                                                FILTERS:
                                                </div>
                                                <div class="options">
                                                                    <label><br>
                                                                            <input type="checkbox" id="multi" onchange="carsearchbar()">
                                                                                                Multi Story
                                                                    </label><br>
                                                                    <label>
                                                                            <input type="checkbox" id="surface" onchange="carsearchbar()">
                                                                                                Surface
                                                                    </label><br>
                                                                    <label>
                                                                            <input type="checkbox" id="onstreet" onchange="carsearchbar()">
                                                                                                Underground
                                                                    </label><br>
                                                                    <label>
                                                                            <input type="checkbox" id="camera" onchange="carsearchbar()">
                                                                                                camera
                                                                    </label><br>                                                                                                                                   
                                                </div>
                            </div>
        </div>
        <br>
        <center style="font-size: 20px;" >
                                       <u>RESULTS</u>
        </center>
        <br>
        <center>
                <p>
                    Select filters or search to see available car parks
                </p>
        </center>
        <div class="contain-table">
            <center> 
            <table>
            <tr>
                <th >Car Park Name</th>
                <th>Times</th>
                <th>Type</th>
                <th>Spaces</th>
                <th>Area</th>
            </tr>
            <tbody id="resultstble"></tbody>
        </table>
            </center>
        </div>
        <div class="results" >
            <button onclick="
                            document.getElementById('searchbar').value='';
                            document.getElementById('multi').checked=false;
                            document.getElementById('surface').checked=false;
                            document.getElementById('onstreet').checked=false;
                            document.getElementById('camera').checked=false;
                            carsearchbar();">
                            View All Results</button>
        </div>
    </body>  
</html>
